name: Gateway 0.3.1 pinned hosted verification

on:
  push:
    branches:
      - ci/hosted-api-031-release-validation-20261019
    paths:
      - .github/workflows/api-recovery-hosted-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinned-kipnerter-gateway-recovery-031
  cancel-in-progress: false

jobs:
  verify:
    # Exact first-party owner-scoped source. This workflow deliberately has no
    # deployment environment, Tailnet credentials, gateway tokens or prod SSH.
    if: >-
      ${{ github.repository == 'scottjoyner/kipnerter' &&
          github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      PINNED_API_SHA: c6a42e0edaeedda06d3702f2f07c82cc8bcd4d59
    steps:
      - name: Checkout immutable gateway candidate
        uses: actions/checkout@v4
        with:
          repository: scottjoyner/kipnerter-api
          ref: c6a42e0edaeedda06d3702f2f07c82cc8bcd4d59
          path: recovery-api
          token: ${{ secrets.KIPNERTER_API_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Prove exact recovery revision and no credential persistence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C recovery-api rev-parse HEAD)" = "$PINNED_API_SHA"
          test ! -e recovery-api/.git-credentials
          test ! -e recovery-api/.env
          echo "API HEAD pinned and production secrets not supplied"
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: recovery-api/pyproject.toml
      - name: Source compilation and isolated test suite
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/recovery-031-env"
          source "$RUNNER_TEMP/recovery-031-env/bin/activate"
          python -m pip install -e './recovery-api[test]'
          cd recovery-api
          python -m compileall -q app tests scripts
          python -m pytest -q tests
          python -m pip check
      - name: Read-only live public gateway method/path compatibility
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/recovery-031-env/bin/activate"
          cd recovery-api
          python scripts/verify_gateway_release_surface.py
      - name: Build isolated release candidate image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull=false --tag kipnerter-api:verified-031 recovery-api
      - name: Check container boot, auth denial and readiness without network
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --tmpfs /data:rw,noexec,nosuid,size=16m \
            -e KIPNERTER_LOCATION_HMAC_SECRET=SYNTHETIC_GATEWAY_TEST_HMAC_KEY_123456789012345678 \
            -e KIPNERTER_GATEWAY_BEARER_TOKEN=SYNTHETIC_GATEWAY_TEST_BEARER_123456789012345678 \
            -e KIPNERTER_ENVIRONMENT=staging \
            kipnerter-api:verified-031 \
            sh -c 'set -eu; uvicorn app.main:app --host 127.0.0.1 --port 8080 --no-access-log >/tmp/api.log 2>&1 & pid=$!; trap "kill $pid 2>/dev/null || true" EXIT; python3 - <<\x27PY\x27
import time,urllib.request,urllib.error,json
base="http://127.0.0.1:8080"
for _ in range(60):
 try:
  urllib.request.urlopen(base+"/ready",timeout=1)
  break
 except Exception:
  time.sleep(.2)
checks=[("/health",200),("/ready",200),("/version",200),("/api/v1",200),("/api/v1/models",200),("/metrics",401),("/api/v1/gateway/lmstudio/v1/models",401)]
for path,expected in checks:
 try:
  with urllib.request.urlopen(base+path,timeout=3) as response: actual=response.status
 except urllib.error.HTTPError as err: actual=err.code
 assert actual==expected,(path,actual,expected)
print("isolated_container_preflight=7/7; production_not_mutated=true")
PY'
