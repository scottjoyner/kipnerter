name: tls-redeploy-once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/tls-redeploy-once.yml

permissions:
  contents: read

jobs:
  redeploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:kipnerter-ci
      - name: Redeploy current master on production host
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/kipnerter.tgz .
          tailscale ssh -o StrictHostKeyChecking=no kipnerter@kipnerter-prod-01 'mkdir -p /opt/kipnerter'
          cat /tmp/kipnerter.tgz | tailscale ssh -o StrictHostKeyChecking=no kipnerter@kipnerter-prod-01 'tar -xzf - -C /opt/kipnerter'
          tailscale ssh -o StrictHostKeyChecking=no kipnerter@kipnerter-prod-01 'cd /opt/kipnerter && docker compose --profile edge up -d --build --remove-orphans && docker compose ps && docker compose logs --tail=100 caddy'
      - name: Validate all production TLS endpoints
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl -fsS https://api.kipnerter.com/health >/dev/null && \
               curl -fsS https://preview.kipnerter.com >/dev/null && \
               curl -fsS https://kipnerter.com >/dev/null && \
               curl -fsS https://www.kipnerter.com >/dev/null && \
               curl -fsS https://scottjoyner.dev >/dev/null && \
               curl -fsS https://admin.scottjoyner.dev >/dev/null; then
              echo 'All production TLS endpoints validated.'
              exit 0
            fi
            sleep 10
          done
          echo 'TLS endpoints did not validate in time.' >&2
          exit 1
