name: digitalocean-prod-recover-once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/digitalocean-prod-recover-once.yml

permissions:
  contents: read

jobs:
  inspect-and-recover:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Inspect production resources
        id: inspect
        run: |
          set -euo pipefail
          echo '=== droplets ==='
          doctl compute droplet list --format ID,Name,Status,PublicIPv4,Region,Image
          echo '=== firewalls ==='
          doctl compute firewall list
          echo '=== snapshots ==='
          doctl compute snapshot list --resource droplet --format ID,Name,CreatedAt || true
          ID=$(doctl compute droplet list --format ID,Name --no-header | awk '$2=="kipnerter-prod-01" {print $1; exit}')
          if [ -n "$ID" ]; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
            echo "id=$ID" >> "$GITHUB_OUTPUT"
            STATUS=$(doctl compute droplet get "$ID" --format Status --no-header | tr -d '[:space:]')
            IP=$(doctl compute droplet get "$ID" --format PublicIPv4 --no-header | tr -d '[:space:]')
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
            echo "ip=$IP" >> "$GITHUB_OUTPUT"
            echo "Production droplet id=$ID status=$STATUS ip=$IP"
          else
            echo 'found=false' >> "$GITHUB_OUTPUT"
            echo 'No kipnerter-prod-01 droplet exists.' >&2
          fi

      - name: Power on production droplet if needed
        if: steps.inspect.outputs.found == 'true' && steps.inspect.outputs.status != 'active'
        run: |
          set -euo pipefail
          ID='${{ steps.inspect.outputs.id }}'
          doctl compute droplet-action power-on "$ID" --wait || doctl compute droplet-action power-cycle "$ID" --wait
          for attempt in {1..30}; do
            STATUS=$(doctl compute droplet get "$ID" --format Status --no-header | tr -d '[:space:]')
            echo "status=$STATUS"
            [ "$STATUS" = active ] && exit 0
            sleep 5
          done
          exit 1

      - name: Verify public network surface
        if: steps.inspect.outputs.found == 'true'
        env:
          PROD_IP: ${{ steps.inspect.outputs.ip }}
        run: |
          set -euo pipefail
          echo "Checking $PROD_IP"
          for port in 80 443 22; do
            if timeout 3 bash -c "</dev/tcp/$PROD_IP/$port" 2>/dev/null; then
              echo "tcp/$port open"
            else
              echo "tcp/$port closed-or-filtered"
            fi
          done
          curl -vk --connect-timeout 5 "https://$PROD_IP" 2>&1 | tail -40 || true
