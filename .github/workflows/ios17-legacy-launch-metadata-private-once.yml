name: Kipnerter 1.7 Private Legacy Launch Metadata Custody (One Shot)

on:
  push:
    branches: [release/17-old-app-source-private-preserve-20261019]

permissions:
  contents: read

concurrency:
  group: kipnerter-17-private-legacy-launch-metadata-once
  cancel-in-progress: false

jobs:
  preserve:
    if: >-
      ${{ github.repository == 'scottjoyner/kipnerter' &&
          github.actor == github.repository_owner &&
          contains(github.event.head_commit.message, '[ios17-legacy-launch-metadata-once]') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - name: Checkout exact reviewed metadata preservation code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Unit test strict private receipt and no-rollback contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest scripts.tests.test_portal_legacy_launch_metadata_once -q
          python3 -m py_compile scripts/portal_legacy_launch_metadata_once.py
      - name: Join scoped production Tailscale CI identity
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:kipnerter-ci
      - name: Select sole production-tagged peer without writing to it
        id: target
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$(tailscale status --json |
            python3 scripts/portal_deploy_target.py --environment production)"
          [[ "$TARGET" =~ ^100[.][0-9]+[.][0-9]+[.][0-9]+$ ]] || exit 2
          tailscale ping --timeout=8s "$TARGET" >/dev/null
          tailscale ssh "kipnerter@$TARGET" 'test "$(id -un)" = kipnerter;
            test -d /home/kipnerter/.local/state/kipnerter-release/state-backups'
          echo "address=$TARGET" >> "$GITHUB_OUTPUT"
      - name: Preserve private metadata without printing values or altering containers
        shell: bash
        env:
          TARGET: ${{ steps.target.outputs.address }}
        run: |
          set -euo pipefail
          [[ "$TARGET" =~ ^100[.][0-9]+[.][0-9]+[.][0-9]+$ ]] || exit 2
          cat scripts/portal_legacy_launch_metadata_once.py |
            timeout 180 tailscale ssh "kipnerter@$TARGET" 'python3 -'
      - name: Record separate hard HOLD on runnable rollback and public release
        if: success()
        run: |
          {
            echo "### Owner-private legacy launch metadata"
            echo "- Two original container launch configurations and a checksum receipt are stored privately."
            echo "- Only environment names and structural hashes stored; no secret values, CI artifacts or public copies."
            echo "- No image restore, Docker create/run, container restart or public route change."
            echo "- Original OCI images and isolated runnable rollback are NOT proven."
            echo "- Production and public fleet-chat release remain HOLD."
          } >> "$GITHUB_STEP_SUMMARY"
