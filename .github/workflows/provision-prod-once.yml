name: provision-prod-once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/provision-prod-once.yml

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_ID: edf851d8-e342-4ffe-9b53-7fdca60b20a0
      DROPLET_NAME: kipnerter-prod-01
      REGION: nyc3
      SIZE: s-2vcpu-4gb
      IMAGE: ubuntu-24-04-x64
      PREVIEW_RECORD_ID: '1828981839'
      API_RECORD_ID: '1828981921'
      FAILED_DROPLET_ID: '592438889'
      FAILED_FIREWALL_ID: '44a1a57b-6701-4139-b246-94a0ae7cf875'
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Join tailnet as CI node
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:kipnerter-ci

      - name: Remove failed blue-green candidate only
        run: |
          set -euo pipefail
          if doctl compute firewall get "$FAILED_FIREWALL_ID" >/dev/null 2>&1; then
            doctl compute firewall delete "$FAILED_FIREWALL_ID" --force
          fi
          if doctl compute droplet get "$FAILED_DROPLET_ID" >/dev/null 2>&1; then
            doctl compute droplet delete "$FAILED_DROPLET_ID" --force
          fi
          # Refuse to touch either legacy host in this workflow.
          doctl compute droplet get 302306571 --format ID,Name,PublicIPv4,Status
          doctl compute droplet get 414171540 --format ID,Name,PublicIPv4,Status

      - name: Create temporary bootstrap SSH key
        id: bootstrap_key
        run: |
          set -euo pipefail
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/kipnerter_bootstrap" -C "kipnerter-ci-${GITHUB_RUN_ID}"
          KEY_NAME="kipnerter-ci-${GITHUB_RUN_ID}"
          KEY_ID=$(doctl compute ssh-key create "$KEY_NAME" \
            --public-key "$(cat "$RUNNER_TEMP/kipnerter_bootstrap.pub")" \
            --format ID --no-header)
          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"
          chmod 600 "$RUNNER_TEMP/kipnerter_bootstrap"

      - name: Create clean production droplet
        id: droplet
        run: |
          set -euo pipefail
          EXISTING_ID=$(doctl compute droplet list --format ID,Name --no-header | awk -v n="$DROPLET_NAME" '$2==n {print $1; exit}')
          if [ -n "$EXISTING_ID" ]; then
            echo "A droplet named $DROPLET_NAME already exists ($EXISTING_ID); refusing to create a duplicate." >&2
            exit 1
          fi
          SSH_KEYS="${{ steps.bootstrap_key.outputs.key_id }},40314313,29638072,29065183,25246348"
          DROPLET_ID=$(doctl compute droplet create "$DROPLET_NAME" \
            --project-id "$PROJECT_ID" \
            --region "$REGION" \
            --size "$SIZE" \
            --image "$IMAGE" \
            --ssh-keys "$SSH_KEYS" \
            --tag-names kipnerter,production,kipnerter-prod \
            --enable-monitoring \
            --enable-private-networking \
            --enable-ipv6 \
            --enable-backups \
            --wait \
            --format ID --no-header)
          echo "droplet_id=$DROPLET_ID" >> "$GITHUB_OUTPUT"
          for attempt in {1..60}; do
            PUBLIC_IP=$(doctl compute droplet get "$DROPLET_ID" --format PublicIPv4 --no-header | tr -d '[:space:]')
            if [ -n "$PUBLIC_IP" ]; then
              echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Create bootstrap cloud firewall
        id: firewall
        run: |
          set -euo pipefail
          RUNNER_IP=$(curl -fsS https://api.ipify.org)
          FIREWALL_ID=$(doctl compute firewall create \
            --name kipnerter-prod \
            --droplet-ids "${{ steps.droplet.outputs.droplet_id }}" \
            --inbound-rules "protocol:tcp,ports:80,address:0.0.0.0/0,address:::/0 protocol:tcp,ports:443,address:0.0.0.0/0,address:::/0 protocol:udp,ports:443,address:0.0.0.0/0,address:::/0 protocol:tcp,ports:22,address:${RUNNER_IP}/32" \
            --outbound-rules "protocol:tcp,ports:1-65535,address:0.0.0.0/0,address:::/0 protocol:udp,ports:1-65535,address:0.0.0.0/0,address:::/0 protocol:icmp,address:0.0.0.0/0,address:::/0" \
            --format ID --no-header)
          echo "firewall_id=$FIREWALL_ID" >> "$GITHUB_OUTPUT"
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"

      - name: Wait for SSH
        env:
          HOST: ${{ steps.droplet.outputs.public_ip }}
        run: |
          set -euo pipefail
          for attempt in {1..90}; do
            if ssh -i "$RUNNER_TEMP/kipnerter_bootstrap" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=no root@"$HOST" true 2>/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Bootstrap host, Tailscale, Docker, and application
        env:
          HOST: ${{ steps.droplet.outputs.public_ip }}
          TS_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "${TS_SECRET}?ephemeral=false&preauthorized=true" | \
            ssh -i "$RUNNER_TEMP/kipnerter_bootstrap" -o StrictHostKeyChecking=no root@"$HOST" \
              'umask 077; cat > /root/.tailscale-bootstrap'

          ssh -i "$RUNNER_TEMP/kipnerter_bootstrap" -o StrictHostKeyChecking=no root@"$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          cloud-init status --wait || true
          wait_for_apt() {
            for attempt in $(seq 1 180); do
              if ! fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 && \
                 ! fuser /var/lib/dpkg/lock >/dev/null 2>&1 && \
                 ! fuser /var/cache/apt/archives/lock >/dev/null 2>&1; then
                return 0
              fi
              sleep 2
            done
            echo "apt/dpkg lock did not clear" >&2
            return 1
          }

          wait_for_apt
          dpkg --configure -a
          apt-get update
          wait_for_apt
          apt-get install -y ca-certificates curl git docker.io docker-compose-v2 unattended-upgrades
          systemctl enable --now docker

          wait_for_apt
          curl -fsSL https://tailscale.com/install.sh -o /tmp/install-tailscale.sh
          sh /tmp/install-tailscale.sh
          rm -f /tmp/install-tailscale.sh
          systemctl enable --now tailscaled

          if ! id kipnerter >/dev/null 2>&1; then
            useradd --create-home --shell /bin/bash --groups sudo,docker kipnerter
          else
            usermod -aG sudo,docker kipnerter
          fi
          install -d -m 0700 -o kipnerter -g kipnerter /home/kipnerter/.ssh
          cp /root/.ssh/authorized_keys /home/kipnerter/.ssh/authorized_keys
          chown kipnerter:kipnerter /home/kipnerter/.ssh/authorized_keys
          chmod 0600 /home/kipnerter/.ssh/authorized_keys
          printf 'kipnerter ALL=(ALL) NOPASSWD:ALL\n' >/etc/sudoers.d/90-kipnerter
          chmod 0440 /etc/sudoers.d/90-kipnerter

          TS_AUTH_KEY=$(cat /root/.tailscale-bootstrap)
          tailscale up \
            --auth-key="$TS_AUTH_KEY" \
            --advertise-tags=tag:kipnerter-prod \
            --hostname=kipnerter-prod-01 \
            --ssh
          unset TS_AUTH_KEY
          shred -u /root/.tailscale-bootstrap 2>/dev/null || rm -f /root/.tailscale-bootstrap

          rm -rf /opt/kipnerter
          git clone https://github.com/scottjoyner/kipnerter.git /opt/kipnerter
          git -C /opt/kipnerter checkout -f master
          git -C /opt/kipnerter reset --hard origin/master
          chown -R kipnerter:kipnerter /opt/kipnerter

          cd /opt/kipnerter
          docker compose --profile edge build
          docker compose --profile edge up -d --remove-orphans
          docker compose ps
          for attempt in $(seq 1 30); do
            if docker compose exec -T api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"; then
              break
            fi
            sleep 2
          done
          docker compose exec -T api python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health').read().decode())"
          REMOTE

      - name: Verify Tailscale path to production host
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if tailscale ping --timeout=10s kipnerter-prod-01; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Move preview and API DNS to clean host
        env:
          NEW_IP: ${{ steps.droplet.outputs.public_ip }}
        run: |
          set -euo pipefail
          doctl compute domain records update kipnerter.com --record-id "$PREVIEW_RECORD_ID" --record-type A --record-name preview --record-data "$NEW_IP" --record-ttl 300
          doctl compute domain records update kipnerter.com --record-id "$API_RECORD_ID" --record-type A --record-name api --record-data "$NEW_IP" --record-ttl 300

      - name: Verify public TLS and application health
        env:
          NEW_IP: ${{ steps.droplet.outputs.public_ip }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils
          for attempt in {1..60}; do
            API_IP=$(dig +short api.kipnerter.com A @1.1.1.1 | tail -1)
            PREVIEW_IP=$(dig +short preview.kipnerter.com A @1.1.1.1 | tail -1)
            echo "api=$API_IP preview=$PREVIEW_IP expected=$NEW_IP"
            if [ "$API_IP" = "$NEW_IP" ] && [ "$PREVIEW_IP" = "$NEW_IP" ] && \
               curl --fail --silent --show-error https://api.kipnerter.com/health >/tmp/health && \
               curl --fail --silent --show-error https://preview.kipnerter.com >/tmp/preview; then
              cat /tmp/health
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Remove public bootstrap SSH rule
        run: |
          set -euo pipefail
          doctl compute firewall remove-rules "${{ steps.firewall.outputs.firewall_id }}" \
            --inbound-rules "protocol:tcp,ports:22,address:${{ steps.firewall.outputs.runner_ip }}/32"

      - name: Remove temporary SSH key from host
        if: success()
        env:
          HOST: ${{ steps.droplet.outputs.public_ip }}
        run: |
          set -euo pipefail
          TEMP_PUB=$(cat "$RUNNER_TEMP/kipnerter_bootstrap.pub")
          ssh -i "$RUNNER_TEMP/kipnerter_bootstrap" -o StrictHostKeyChecking=no root@"$HOST" \
            "sed -i '\|$TEMP_PUB|d' /root/.ssh/authorized_keys; sed -i '\|$TEMP_PUB|d' /home/kipnerter/.ssh/authorized_keys; chown kipnerter:kipnerter /home/kipnerter/.ssh/authorized_keys; chmod 600 /root/.ssh/authorized_keys /home/kipnerter/.ssh/authorized_keys"

      - name: Report production state
        if: success()
        run: |
          echo "Production droplet ID: ${{ steps.droplet.outputs.droplet_id }}"
          echo "Production IPv4: ${{ steps.droplet.outputs.public_ip }}"
          echo "Firewall ID: ${{ steps.firewall.outputs.firewall_id }}"
          tailscale status
          doctl compute droplet get "${{ steps.droplet.outputs.droplet_id }}"
          doctl compute firewall get "${{ steps.firewall.outputs.firewall_id }}"

      - name: Preserve state on failure
        if: failure()
        run: |
          echo "Provisioning failed before DNS validation completed; legacy hosts remain untouched."
          doctl compute droplet list || true
          doctl compute firewall list || true

      - name: Delete temporary DigitalOcean SSH key
        if: always()
        run: |
          KEY_ID='${{ steps.bootstrap_key.outputs.key_id }}'
          if [ -n "$KEY_ID" ]; then
            doctl compute ssh-key delete "$KEY_ID" --force >/dev/null 2>&1 || true
          fi
