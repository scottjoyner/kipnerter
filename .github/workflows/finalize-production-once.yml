name: finalize-production-once

on:
  push:
    branches: [master]
    paths: [.github/workflows/finalize-production-once.yml]

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:kipnerter-ci

      - name: Resolve live production node
        id: prod
        run: |
          set -euo pipefail
          tailscale status --json > /tmp/ts.json
          IP=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ts.json'))
          c=[]
          for p in d.get('Peer',{}).values():
              if p.get('Online') and 'tag:kipnerter-prod' in set(p.get('Tags') or []):
                  v4=next((x for x in (p.get('TailscaleIPs') or []) if ':' not in x),None)
                  if v4: c.append(((p.get('HostName') or ''),v4))
          if not c: raise SystemExit('no online prod node')
          c.sort(); print(c[-1][1])
          PY
          )
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          tailscale ping --timeout=10s "$IP"

      - name: Audit authoritative DNS
        run: |
          set -euo pipefail
          echo '=== kipnerter.com ==='
          doctl compute domain records list kipnerter.com
          echo '=== scottjoyner.dev ==='
          doctl compute domain records list scottjoyner.dev

      - name: Remove obsolete unattached legacy firewall
        run: |
          set -euo pipefail
          ID=$(doctl compute firewall list --format ID,Name,DropletIDs --no-header | awk '$2=="Thegreatfirewall" && NF==2 {print $1; exit}')
          if [ -n "$ID" ]; then
            echo "Deleting obsolete unattached firewall $ID"
            doctl compute firewall delete "$ID" --force
          else
            echo 'Legacy firewall absent or attached; no deletion performed.'
          fi

      - name: Retry Caddy certificate issuance
        env:
          PROD_TS_IP: ${{ steps.prod.outputs.ip }}
        run: |
          set -euo pipefail
          tailscale ssh kipnerter@"$PROD_TS_IP" 'cd /opt/kipnerter && docker compose restart caddy && sleep 8 && docker compose ps && docker compose logs --since=10m caddy | tail -250'

      - name: Report private integration configuration
        env:
          ASSISTX_BASE_URL: ${{ secrets.ASSISTX_BASE_URL }}
          SOPHIA_BASE_URL: ${{ secrets.SOPHIA_BASE_URL }}
          LMSTUDIO_BASE_URL: ${{ secrets.LMSTUDIO_BASE_URL }}
        run: |
          for pair in "ASSISTX_BASE_URL:$ASSISTX_BASE_URL" "SOPHIA_BASE_URL:$SOPHIA_BASE_URL" "LMSTUDIO_BASE_URL:$LMSTUDIO_BASE_URL"; do
            name=${pair%%:*}; value=${pair#*:}
            if [ -n "$value" ]; then echo "$name=configured"; else echo "$name=missing"; fi
          done

      - name: Validate public surface
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            ok=1
            for url in https://kipnerter.com https://www.kipnerter.com https://preview.kipnerter.com https://scottjoyner.dev https://admin.scottjoyner.dev https://api.kipnerter.com/health https://api.kipnerter.com/ready https://api.kipnerter.com/api/v1/services https://api.kipnerter.com/api/v1/models; do
              if ! curl -fsS --connect-timeout 5 "$url" >/dev/null; then ok=0; fi
            done
            [ "$ok" = 1 ] && exit 0
            sleep 10
          done
          exit 1
