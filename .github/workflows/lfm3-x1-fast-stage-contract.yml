name: LFM3 x1 fast staging read-only source contract

on:
  pull_request:
    paths:
      - 'scripts/lfm3_x1_fast_stage_audit.py'
      - 'scripts/lfm3_x1_durable_preflight.py'
      - 'deploy/lfm3/systemd/**'
      - 'apps/web/tests/lfm3-x1-fast-stage-audit-contract.test.mjs'
      - '.github/workflows/lfm3-x1-fast-stage-contract.yml'
      - 'deploy/lfm3/X1_FAST_STAGE.md'

permissions:
  contents: read

jobs:
  synthetic-code-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate auditor syntax
        run: python3 -m py_compile scripts/lfm3_x1_fast_stage_audit.py scripts/lfm3_x1_durable_preflight.py
      - name: Validate fail-closed contracts
        run: node --test apps/web/tests/lfm3-x1-fast-stage-audit-contract.test.mjs
