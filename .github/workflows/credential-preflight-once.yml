name: credential-preflight-once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/credential-preflight-once.yml

permissions:
  contents: read

jobs:
  digitalocean:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Verify DigitalOcean API
        run: |
          set -euo pipefail
          doctl account get
          doctl compute droplet get 414171540 --format ID,Name,Status,PublicIPv4,Image

  tailscale:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Join tailnet with production OAuth credentials
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:kipnerter-ci
      - name: Verify tailnet
        run: |
          set -euo pipefail
          tailscale status
          tailscale ip -4
