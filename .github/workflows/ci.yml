name: ci

on:
  push:
    branches: [master, main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=moderate
      - run: node --test tests/*.test.mjs
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exercise real NextAuth / BFF / API / SSE against isolated fixtures
        run: |
          python3 -m pip install -r ../api/requirements.txt
          python3 ../../scripts/portal_e2e_smoke.py
      - name: Verify anonymous portal is visible and telemetry fails closed
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --port 3012 >/tmp/kipnerter-web-ci.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for attempt in {1..25}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3012/chat >/tmp/kipnerter-chat.html; then break; fi
            sleep 1
          done
          grep -q 'PRIVATE AI WORKSPACE' /tmp/kipnerter-chat.html
          [[ $(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3012/api/portal/live) = 503 ]]
          [[ $(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3012/api/portal/traces) = 503 ]]

  containers:
    runs-on: ubuntu-latest
    env:
      KIPNERTER_SPATIAL_API_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      KIPNERTER_SPATIAL_DB_PASSWORD: bbbbbbbbbbbbbbbbbbbbbbbb
      KIPNERTER_SPATIAL_S3_ACCESS_KEY_ID: cccccccccccc
      KIPNERTER_SPATIAL_S3_SECRET_ACCESS_KEY: dddddddddddddddddddddddddddddddddddddddd
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f compose.dev.yml config --quiet
      - run: docker compose -f docker-compose.yml -f compose.spatial.yml --profile edge config --quiet
      - run: python3 -m py_compile scripts/spatial-smoke.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m py_compile scripts/portal_oidc_preflight.py
      - run: sh -n scripts/spatial-worker-proof.sh
      - run: bash -n scripts/install-telemetry-observer.sh
      - run: python3 -m py_compile apps/api/app/tailnet_observer.py apps/api/app/agent_sessions_observer.py apps/api/app/trace_snapshot_observer.py scripts/refresh_assistx_trace_snapshot.py
      - run: docker run --rm -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
      - run: docker compose build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/digitalocean/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
