name: ci

on:
  push:
    branches: [master, main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    env:
      KIPNERTER_SPATIAL_API_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      KIPNERTER_SPATIAL_DB_PASSWORD: bbbbbbbbbbbbbbbbbbbbbbbb
      KIPNERTER_SPATIAL_S3_ACCESS_KEY_ID: cccccccccccc
      KIPNERTER_SPATIAL_S3_SECRET_ACCESS_KEY: dddddddddddddddddddddddddddddddddddddddd
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f compose.dev.yml config --quiet
      - run: docker compose -f docker-compose.yml -f compose.spatial.yml --profile edge config --quiet
      - run: python3 -m py_compile scripts/spatial-smoke.py
      - run: sh -n scripts/spatial-worker-proof.sh
      - run: docker run --rm -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
      - run: docker compose build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/digitalocean/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
