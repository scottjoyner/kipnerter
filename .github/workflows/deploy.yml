name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options: [staging, production]
        default: staging
      spatial_api_ref:
        description: Exact kipnerter-api commit to deploy
        required: true
        default: 3490c05ce529b9d8775e9c99f358bb95481331f5
        type: string

permissions:
  contents: read

concurrency:
  group: kipnerter-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 45
    steps:
      - name: Check out platform control plane
        uses: actions/checkout@v4

      - name: Check out immutable spatial backend
        uses: actions/checkout@v4
        with:
          repository: scottjoyner/kipnerter-api
          ref: ${{ inputs.spatial_api_ref }}
          path: spatial-api
          token: ${{ secrets.KIPNERTER_API_REPO_TOKEN }}
          fetch-depth: 1

      - name: Verify spatial backend revision
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git -C spatial-api rev-parse HEAD)"
          [[ "$ACTUAL" == "${{ inputs.spatial_api_ref }}" ]] || { echo "::error::Spatial checkout $ACTUAL does not match requested ${{ inputs.spatial_api_ref }}"; exit 1; }

      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:kipnerter-ci

      - name: Validate OIDC provider over Tailscale
        if: inputs.environment == 'production'
        env:
          TSIDP_ISSUER: ${{ secrets.TSIDP_ISSUER }}
          NEXTAUTH_URL: https://kipnerter.com
        run: python3 scripts/portal_oidc_preflight.py

      - name: Resolve deployment target
        id: target
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          FALLBACK_HOST: ${{ secrets.KIPNERTER_DEPLOY_HOST }}
          FALLBACK_USER: ${{ secrets.KIPNERTER_DEPLOY_USER }}
        run: |
          set -euo pipefail
          if [ "$ENVIRONMENT" = production ]; then
            tailscale status --json > /tmp/ts.json
            TARGET=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ts.json'))
          candidates=[]
          for p in d.get('Peer',{}).values():
              host=p.get('HostName') or ''
              tags=set(p.get('Tags') or [])
              if p.get('Online') and 'tag:kipnerter-prod' in tags and host.startswith('kipnerter-prod-01'):
                  ip=next((x for x in (p.get('TailscaleIPs') or []) if ':' not in x), None)
                  if ip: candidates.append((host,ip))
          if not candidates: raise SystemExit('No online tagged production node found')
          candidates.sort()
          print(candidates[-1][1])
          PY
            )
            USER=kipnerter
          else
            test -n "$FALLBACK_HOST" && test -n "$FALLBACK_USER"
            TARGET="$FALLBACK_HOST"
            USER="$FALLBACK_USER"
          fi
          echo "host=$TARGET" >> "$GITHUB_OUTPUT"
          echo "user=$USER" >> "$GITHUB_OUTPUT"
          tailscale ping --timeout=10s "$TARGET"
          tailscale ssh "$USER@$TARGET" 'hostname; docker --version; docker compose version'

      - name: Validate required spatial secrets
        if: inputs.environment == 'production'
        env:
          API_KEY: ${{ secrets.KIPNERTER_SPATIAL_API_KEY }}
          DB_PASSWORD: ${{ secrets.KIPNERTER_SPATIAL_DB_PASSWORD }}
          S3_ACCESS: ${{ secrets.KIPNERTER_SPATIAL_S3_ACCESS_KEY_ID }}
          S3_SECRET: ${{ secrets.KIPNERTER_SPATIAL_S3_SECRET_ACCESS_KEY }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          TSIDP_ISSUER: ${{ secrets.TSIDP_ISSUER }}
          TSIDP_CLIENT_ID: ${{ secrets.TSIDP_CLIENT_ID }}
          TSIDP_CLIENT_SECRET: ${{ secrets.TSIDP_CLIENT_SECRET }}
          KIPNERTER_ALLOWED_EMAILS: ${{ secrets.KIPNERTER_ALLOWED_EMAILS }}
          KIPNERTER_ALLOWED_TSIDP_SUBJECTS: ${{ secrets.KIPNERTER_ALLOWED_TSIDP_SUBJECTS }}
          FLEET_MONITOR_BASE_URL: ${{ secrets.FLEET_MONITOR_BASE_URL }}
          FLEET_MONITOR_TOKEN: ${{ secrets.FLEET_MONITOR_TOKEN }}
          ASSISTX_BASE_URL: ${{ secrets.ASSISTX_BASE_URL }}
        run: |
          set -euo pipefail
          for value in API_KEY DB_PASSWORD S3_ACCESS S3_SECRET; do
            [[ -n "${!value:-}" ]] || { echo "::error::Missing required production secret $value"; exit 1; }
          done
          # Portal OIDC is a release gate, not merely a runtime warning.
          for value in NEXTAUTH_SECRET TSIDP_ISSUER TSIDP_CLIENT_ID TSIDP_CLIENT_SECRET KIPNERTER_ALLOWED_EMAILS KIPNERTER_ALLOWED_TSIDP_SUBJECTS; do
            [[ -n "${!value:-}" ]] || { echo "::error::Missing portal authentication setting $value"; exit 1; }
          done
          [[ ${#NEXTAUTH_SECRET} -ge 32 ]] || { echo "::error::NEXTAUTH_SECRET must be at least 32 chars"; exit 1; }
          [[ "$TSIDP_ISSUER" == https://* ]] || { echo "::error::TSIDP_ISSUER must use HTTPS"; exit 1; }
          for value in FLEET_MONITOR_BASE_URL FLEET_MONITOR_TOKEN; do
            [[ -n "${!value:-}" ]] || { echo "::error::Missing required read-only fleet integration $value"; exit 1; }
          done
          [[ ${#FLEET_MONITOR_TOKEN} -ge 32 ]] || { echo "::error::FLEET_MONITOR_TOKEN must be >=32 chars"; exit 1; }
          [[ ${#API_KEY} -ge 32 ]] || { echo "::error::KIPNERTER_SPATIAL_API_KEY must be at least 32 characters"; exit 1; }
          [[ ${#DB_PASSWORD} -ge 20 ]] || { echo "::error::KIPNERTER_SPATIAL_DB_PASSWORD must be at least 20 characters"; exit 1; }
          [[ "$DB_PASSWORD" =~ ^[A-Za-z0-9._~-]+$ ]] || { echo "::error::KIPNERTER_SPATIAL_DB_PASSWORD must use URL-safe characters"; exit 1; }
          [[ ${#S3_SECRET} -ge 32 ]] || { echo "::error::KIPNERTER_SPATIAL_S3_SECRET_ACCESS_KEY must be at least 32 characters"; exit 1; }

      - name: Preserve and verify production application rollback snapshot
        if: inputs.environment == 'production'
        env:
          TARGET: ${{ steps.target.outputs.host }}
          USER: ${{ steps.target.outputs.user }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Non-immutable release SHA"; exit 1; }
          # Snapshot the live deployed application BEFORE overwriting a file.
          # This uses stdin to run the exact checked-in verifier and leaves
          # only a mode-0600 archive in an owner-private directory. The SSH
          # identity check in "Resolve deployment target" must pass first.
          cat scripts/portal_release_backup.py | tailscale ssh "$USER@$TARGET" \
            "python3 - snapshot --root /opt/kipnerter --backup-dir /home/kipnerter/.local/share/kipnerter-release-backups --revision $GITHUB_SHA"
          # Database/volume state is NOT in this snapshot. Promotion still
          # requires a separately rehearsed application/DB rollback.

      - name: Upload revision after verified rollback snapshot
        env:
          TARGET: ${{ steps.target.outputs.host }}
          USER: ${{ steps.target.outputs.user }}
          ENVIRONMENT: ${{ inputs.environment }}
          ASSISTX_BASE_URL: ${{ secrets.ASSISTX_BASE_URL }}
          SOPHIA_BASE_URL: ${{ secrets.SOPHIA_BASE_URL }}
          LMSTUDIO_BASE_URL: ${{ secrets.LMSTUDIO_BASE_URL }}
          HERMES_BASE_URL: ${{ secrets.HERMES_BASE_URL }}
          OPENCODE_BASE_URL: ${{ secrets.OPENCODE_BASE_URL }}
          FLEET_MONITOR_BASE_URL: ${{ secrets.FLEET_MONITOR_BASE_URL }}
          FLEET_MONITOR_TOKEN: ${{ secrets.FLEET_MONITOR_TOKEN }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          TSIDP_ISSUER: ${{ secrets.TSIDP_ISSUER }}
          TSIDP_CLIENT_ID: ${{ secrets.TSIDP_CLIENT_ID }}
          TSIDP_CLIENT_SECRET: ${{ secrets.TSIDP_CLIENT_SECRET }}
          KIPNERTER_ALLOWED_EMAILS: ${{ secrets.KIPNERTER_ALLOWED_EMAILS }}
          KIPNERTER_ALLOWED_TSIDP_SUBJECTS: ${{ secrets.KIPNERTER_ALLOWED_TSIDP_SUBJECTS }}
          GATEWAY_TOKEN_OVERRIDE: ${{ secrets.KIPNERTER_GATEWAY_TOKEN }}
          SPATIAL_API_KEY: ${{ secrets.KIPNERTER_SPATIAL_API_KEY }}
          SPATIAL_DB_PASSWORD: ${{ secrets.KIPNERTER_SPATIAL_DB_PASSWORD }}
          SPATIAL_S3_ACCESS_KEY_ID: ${{ secrets.KIPNERTER_SPATIAL_S3_ACCESS_KEY_ID }}
          SPATIAL_S3_SECRET_ACCESS_KEY: ${{ secrets.KIPNERTER_SPATIAL_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude='*/.git' -czf /tmp/kipnerter.tgz .
          tailscale ssh "$USER@$TARGET" 'sudo mkdir -p /opt/kipnerter && sudo chown -R '"$USER:$USER"' /opt/kipnerter'
          cat /tmp/kipnerter.tgz | tailscale ssh "$USER@$TARGET" 'tar -xzf - -C /opt/kipnerter'
          if [ "$ENVIRONMENT" = production ]; then
            # Do not manufacture private-service URLs. Each configured upstream
            # must have an independently verified, permitted tailnet route.
            ASSISTX_BASE_URL="${ASSISTX_BASE_URL:-}"
            SOPHIA_BASE_URL="${SOPHIA_BASE_URL:-}"
            LMSTUDIO_BASE_URL="${LMSTUDIO_BASE_URL:-}"
            GATEWAY_TOKEN="$GATEWAY_TOKEN_OVERRIDE"
            if [ -z "$GATEWAY_TOKEN" ]; then
              GATEWAY_TOKEN=$(tailscale ssh "$USER@$TARGET" "sed -n 's/^KIPNERTER_GATEWAY_TOKEN=//p' /opt/kipnerter/.env 2>/dev/null | head -n1" || true)
            fi
            if [ -z "$GATEWAY_TOKEN" ]; then
              GATEWAY_TOKEN=$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(48))
          PY
              )
            fi
            {
              printf 'KIPNERTER_ENV=production\n'
              printf 'NEXTAUTH_URL=https://kipnerter.com\n'
              printf 'NEXTAUTH_SECRET=%s\n' "$NEXTAUTH_SECRET"
              printf 'TSIDP_ISSUER=%s\n' "$TSIDP_ISSUER"
              printf 'TSIDP_CLIENT_ID=%s\n' "$TSIDP_CLIENT_ID"
              printf 'TSIDP_CLIENT_SECRET=%s\n' "$TSIDP_CLIENT_SECRET"
              printf 'KIPNERTER_ALLOWED_EMAILS=%s\n' "$KIPNERTER_ALLOWED_EMAILS"
              printf 'KIPNERTER_ALLOWED_TSIDP_SUBJECTS=%s\n' "$KIPNERTER_ALLOWED_TSIDP_SUBJECTS"
              printf 'HERMES_BASE_URL=%s\n' "$HERMES_BASE_URL"
              printf 'OPENCODE_BASE_URL=%s\n' "$OPENCODE_BASE_URL"
              printf 'FLEET_MONITOR_BASE_URL=%s\n' "$FLEET_MONITOR_BASE_URL"
              printf 'FLEET_MONITOR_TOKEN=%s\n' "$FLEET_MONITOR_TOKEN"
              printf 'NEXT_PUBLIC_API_URL=https://api.kipnerter.com\n'
              printf 'CORS_ORIGINS=https://kipnerter.com,https://www.kipnerter.com,https://scottjoyner.dev,https://admin.scottjoyner.dev,https://preview.kipnerter.com\n'
              printf 'ASSISTX_BASE_URL=%s\n' "$ASSISTX_BASE_URL"
              printf 'SOPHIA_BASE_URL=%s\n' "$SOPHIA_BASE_URL"
              printf 'LMSTUDIO_BASE_URL=%s\n' "$LMSTUDIO_BASE_URL"
              printf 'KIPNERTER_GATEWAY_TOKEN=%s\n' "$GATEWAY_TOKEN"
              printf 'GATEWAY_MAX_BODY_BYTES=1048576\n'
              printf 'GATEWAY_UPSTREAM_TIMEOUT_SECONDS=20\n'
              printf 'KIPNERTER_SPATIAL_API_KEY=%s\n' "$SPATIAL_API_KEY"
              printf 'KIPNERTER_SPATIAL_DB_PASSWORD=%s\n' "$SPATIAL_DB_PASSWORD"
              printf 'KIPNERTER_SPATIAL_S3_ACCESS_KEY_ID=%s\n' "$SPATIAL_S3_ACCESS_KEY_ID"
              printf 'KIPNERTER_SPATIAL_S3_SECRET_ACCESS_KEY=%s\n' "$SPATIAL_S3_SECRET_ACCESS_KEY"
            } > /tmp/kipnerter.env
            chmod 600 /tmp/kipnerter.env
            cat /tmp/kipnerter.env | tailscale ssh "$USER@$TARGET" 'cat > /opt/kipnerter/.env && chmod 600 /opt/kipnerter/.env'
            rm -f /tmp/kipnerter.env
          fi

      - name: Build and deploy
        env:
          TARGET: ${{ steps.target.outputs.host }}
          USER: ${{ steps.target.outputs.user }}
        run: |
          set -euo pipefail
          tailscale ssh "$USER@$TARGET" 'cd /opt/kipnerter && docker compose -f docker-compose.yml -f compose.spatial.yml --profile edge config >/tmp/kipnerter-compose.yml && docker compose -f docker-compose.yml -f compose.spatial.yml --profile edge build --pull && docker compose -f docker-compose.yml -f compose.spatial.yml --profile edge up -d --remove-orphans && docker compose -f docker-compose.yml -f compose.spatial.yml ps'

      - name: Verify production health
        if: inputs.environment == 'production'
        env:
          TARGET: ${{ steps.target.outputs.host }}
          USER: ${{ steps.target.outputs.user }}
        run: |
          set -euo pipefail
          # A failed public route must fail the release: never fall through
          # after retries and accidentally mark a missing /chat as healthy.
          python3 scripts/verify_portal_release.py --attempts 30 --interval 10
          # Read env as data, not as shell code. Never print the bearer secret.
          tailscale ssh "$USER@$TARGET" /bin/bash -se <<'REMOTE'
          python3 - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          line = next((line for line in Path('/opt/kipnerter/.env').read_text().splitlines()
                       if line.startswith('KIPNERTER_GATEWAY_TOKEN=')), '')
          token = line.partition('=')[2]
          if len(token) < 32:
              raise SystemExit('Invalid server-side gateway token')
          headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/json'}
          base = 'https://api.kipnerter.com/api/v1/control-plane/'
          for name, expected in [('overview', 'reported'), ('nodes', 'live'),
                                 ('models', None), ('sessions', 'reported'), ('traces', None)]:
              with urllib.request.urlopen(
                  urllib.request.Request(base + name, headers=headers), timeout=12
              ) as reply:
                  data = json.load(reply)
              status = data.get('observer_status') if name == 'overview' else (
                  data.get('tailscale_status') if name == 'nodes' else data.get('status')
              )
              if name == 'models':
                  if status not in ('reported','reported_empty') or data.get('source') != 'assistx_local_inventory':
                      raise SystemExit('models: authenticated, sanitized AssistX inventory unavailable')
              elif name == 'traces':
                  if status not in ('live', 'historical') or not data.get('traces'):
                      raise SystemExit('traces: authenticated metadata index unavailable')
                  if data.get('source') != 'assistx_trace_index':
                      raise SystemExit('traces: unrecognized trace source')
              elif status != expected:
                  raise SystemExit(f'{name}: missing required authenticated telemetry')
              if name == 'nodes' and not data.get('nodes'):
                  raise SystemExit('No authenticated fleet nodes observed')
          print('Read-only fleet telemetry verified')
          PY
          REMOTE
          echo "Authenticated control plane and Tailscale node feed verified."

      - name: Show deployment state on failure
        if: failure()
        env:
          TARGET: ${{ steps.target.outputs.host }}
          USER: ${{ steps.target.outputs.user }}
        run: tailscale ssh "$USER@$TARGET" 'cd /opt/kipnerter && docker compose -f docker-compose.yml -f compose.spatial.yml ps && docker compose -f docker-compose.yml -f compose.spatial.yml logs --tail=150 api web caddy spatial-api spatial-worker spatial-postgres spatial-minio' || true
