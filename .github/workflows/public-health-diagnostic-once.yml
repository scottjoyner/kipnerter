name: public-health-diagnostic-once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/public-health-diagnostic-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Diagnose DNS and direct TLS
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils
          ID=$(doctl compute droplet list --format ID,Name --no-header | awk '$2=="kipnerter-prod-01" {print $1; exit}')
          IP=$(doctl compute droplet get "$ID" --format PublicIPv4 --no-header | tr -d '[:space:]')
          echo "target=$IP"
          for host in kipnerter.com www.kipnerter.com api.kipnerter.com preview.kipnerter.com scottjoyner.dev admin.scottjoyner.dev; do
            echo "=== $host ==="
            echo "cloudflare=$(dig +short "$host" A @1.1.1.1 | tail -1)"
            echo "google=$(dig +short "$host" A @8.8.8.8 | tail -1)"
            curl -fsS --resolve "$host:443:$IP" "https://$host${host/api.kipnerter.com//health}" -o /dev/null && echo 'direct_tls=ok' || echo 'direct_tls=fail'
          done
