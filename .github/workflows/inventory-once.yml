name: inventory-once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/inventory-once.yml
      - infra/digitalocean/inventory.sh

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Inventory DigitalOcean
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: bash infra/digitalocean/inventory.sh
      - name: DNS preflight
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils
          for host in kipnerter.com preview.kipnerter.com api.kipnerter.com app.kipnerter.com; do
            echo "===== $host ====="
            echo "Cloudflare"
            dig +noall +answer "$host" A @1.1.1.1 || true
            echo "Google"
            dig +noall +answer "$host" A @8.8.8.8 || true
          done
