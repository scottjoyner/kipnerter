services:
  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.kipnerter.com}
      KIPNERTER_INTERNAL_API_URL: http://api:8000
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://kipnerter.com}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      TSIDP_ISSUER: ${TSIDP_ISSUER:-}
      TSIDP_CLIENT_ID: ${TSIDP_CLIENT_ID:-}
      TSIDP_CLIENT_SECRET: ${TSIDP_CLIENT_SECRET:-}
      KIPNERTER_ALLOWED_EMAILS: ${KIPNERTER_ALLOWED_EMAILS:-}
      KIPNERTER_GATEWAY_TOKEN: ${KIPNERTER_GATEWAY_TOKEN:-}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [frontend]

  api:
    build:
      context: ./apps/api
    environment:
      KIPNERTER_ENV: ${KIPNERTER_ENV:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://kipnerter.com,https://www.kipnerter.com,https://scottjoyner.dev}
      ASSISTX_BASE_URL: ${ASSISTX_BASE_URL:-}
      SOPHIA_BASE_URL: ${SOPHIA_BASE_URL:-}
      HERMES_BASE_URL: ${HERMES_BASE_URL:-}
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-}
      FLEET_MONITOR_BASE_URL: ${FLEET_MONITOR_BASE_URL:-}
      FLEET_MONITOR_TOKEN: ${FLEET_MONITOR_TOKEN:-}
      ASSISTX_MONITOR_USER: ${ASSISTX_MONITOR_USER:-}
      ASSISTX_MONITOR_PASSWORD: ${ASSISTX_MONITOR_PASSWORD:-}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-}
      KIPNERTER_GATEWAY_TOKEN: ${KIPNERTER_GATEWAY_TOKEN:-}
      GATEWAY_MAX_BODY_BYTES: ${GATEWAY_MAX_BODY_BYTES:-1048576}
      GATEWAY_UPSTREAM_TIMEOUT_SECONDS: ${GATEWAY_UPSTREAM_TIMEOUT_SECONDS:-20}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [frontend, backend]

  caddy:
    image: caddy:2
    profiles: ["edge"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped
    networks: [frontend]

networks:
  frontend:
  backend:
    internal: true

volumes:
  caddy_data:
  caddy_config:
