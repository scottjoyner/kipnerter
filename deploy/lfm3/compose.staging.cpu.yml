# Opt-in REAL LFM3 CPU staging candidate, deliberately independent of RX480.
# NO publicly exposed ports, RX480 mount, production network, or shared runtime.
# Images must be separately reviewed and pinned by immutable sha256 digests.
services:
  kipnerter-lfm3-stage-cpu-model:
    image: ${KIPNERTER_LFM3_CPU_MODEL_IMAGE:?Pinned reviewed llama.cpp CPU image required}
    container_name: kipnerter-lfm3-stage-cpu-model
    restart: "no"
    entrypoint: ["/app/llama-server"]
    command:
      - "-m"
      - "/models/LFM3-1.7B-Q4_K_M.gguf"
      - "--alias"
      - "lfm3-1.7b-cpu"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "1536"
      - "--parallel"
      - "1"
      - "--threads"
      - "2"
      - "--n-gpu-layers"
      - "0"
    cpus: 1.5
    mem_limit: 3g
    memswap_limit: 3g
    pids_limit: 100
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,noexec,size=64m"]
    user: "10001:10001"
    networks: [cpu_model]
    volumes:
      - type: bind
        source: ${KIPNERTER_LFM3_CPU_MODEL_FILE:?Verified official GGUF file required}
        target: /models/LFM3-1.7B-Q4_K_M.gguf
        read_only: true
        bind:
          create_host_path: false

  kipnerter-lfm3-stage-cpu-web:
    image: ${KIPNERTER_LFM3_CPU_WEB_IMAGE:?Exact-source pinned web image required}
    container_name: kipnerter-lfm3-stage-cpu-web
    restart: "no"
    ports: ["127.0.0.1:3363:3000"]
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 100
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      KIPNERTER_ENV: staging
      KIPNERTER_LFM3_ENDPOINTS: >-
        [{"name":"cpu_stage","baseUrl":"http://kipnerter-lfm3-stage-cpu-model:8080","model":"lfm3-1.7b-cpu","adapter":"openai","role":"interactive","maxInflight":1,"maxOutputTokens":128}]
    networks: [cpu_preview, cpu_model]

networks:
  cpu_preview: {}
  cpu_model:
    internal: true
