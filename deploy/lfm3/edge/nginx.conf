# UNAPPLIED central rate-limiter candidate for the LFM3 public chat route.
# Run only after explicit approval, exact-image pinning, key provisioning and
# authenticated gateway acceptance. Intended to share the Caddy container's
# network namespace, listening solely on that namespace's loopback interface.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx-lfm3.pid;

events {
    worker_connections 128;
}

http {
    access_log off;
    sendfile off;
    server_tokens off;
    client_max_body_size 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;

    # Caddy overwrites X-Real-IP from {remote_host}. The sidecar's listener
    # is localhost-only inside Caddy's namespace; this is not a public API.
    # Do not reconfigure it onto a shared Docker bridge or publish ports.
    map $http_x_real_ip $lfm3_client_key {
        default $http_x_real_ip;
        "" $remote_addr;
    }

    # Nginx shared-memory zones coordinate all workers in this ONE sidecar
    # (not every process or remote host). Strict per-client and global caps.
    limit_req_zone $lfm3_client_key zone=lfm3_client:1m rate=6r/m;
    limit_req_zone $server_name zone=lfm3_global:1m rate=30r/m;
    limit_conn_zone $server_name zone=lfm3_connections:1m;

    server {
        listen 127.0.0.1:8094;
        server_name _;
        limit_req_status 429;
        limit_conn_status 429;
        add_header Cache-Control "private, no-store" always;

        location = /api/chat/completions {
            if ($request_method != POST) { return 405; }
            limit_req zone=lfm3_client burst=2 nodelay;
            limit_req zone=lfm3_global burst=5 nodelay;
            limit_conn lfm3_connections 2;

            proxy_http_version 1.1;
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 45s;
            proxy_intercept_errors off;
            proxy_buffering off;
            proxy_set_header Host kipnerter.com;
            proxy_set_header X-Forwarded-Host kipnerter.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $lfm3_client_key;
            proxy_set_header X-Real-IP $lfm3_client_key;
            proxy_pass http://kipnerter-lfm3-stage-provisioned:3000;
        }

        location / { return 404; }
    }
}
