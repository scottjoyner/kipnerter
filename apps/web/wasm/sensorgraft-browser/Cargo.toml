[package]
name = "sensorgraft-browser"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Browser-isolated exact cosine vector index adapter for SensorGraft traces"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = "symbols"
