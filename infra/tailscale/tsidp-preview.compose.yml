name: kipnerter-oidc-bootstrap
services:
  idp:
    image: ghcr.io/tailscale/tsidp@sha256:7a30d56cb1a33fd72ea44b12ab3659b5c7a8a3afe3cf4ada76a700f19b96185b
    container_name: kipnerter-oidc-bootstrap-idp
    restart: 'no'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 128
    mem_limit: 268435456
    cpus: 0.5
    environment:
      TAILSCALE_USE_WIP_CODE: '1'
      TS_STATE_DIR: /data
      TS_HOSTNAME: kipnerter-idp-staging
      TS_ADVERTISE_TAGS: tag:tsidp
      TSIDP_ENABLE_STS: '0'
    volumes:
      - idp_data:/data
    networks: [idp_network]
networks:
  idp_network: {}
volumes:
  idp_data: {}
