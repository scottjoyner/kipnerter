# Exact verified production Nginx public-guest gate.
# Deploy only with the pinned, separately verified system CA bundle mounted at
# /etc/nginx/verified-host-ca.pem. No public listening/published Docker port.
worker_processes 1;
pid /tmp/kipnerter-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  access_log off;
  client_body_temp_path /tmp/lfm3-client-body;
  proxy_temp_path /tmp/lfm3-proxy;
  fastcgi_temp_path /tmp/lfm3-fastcgi;
  uwsgi_temp_path /tmp/lfm3-uwsgi;
  scgi_temp_path /tmp/lfm3-scgi;
  server_tokens off;
  limit_req_zone $http_x_kipnerter_client_ip zone=lfm3_ip:1m rate=3r/m;
  limit_req_zone $server_name zone=lfm3_global:1m rate=12r/m;
  limit_conn_zone $server_name zone=lfm3_active:1m;
  limit_req_status 429;
  limit_conn_status 429;
  send_timeout 15s;
  server {
    listen 8080;
    server_name lfm3-gate;
    client_max_body_size 16k;
    location = /_gate_health { return 200 "healthy\n"; }
    location = /api/chat/completions {
      limit_except POST { deny all; }
      if ($http_x_kipnerter_client_ip = "") { return 403; }
      client_max_body_size 8192;
      limit_req zone=lfm3_ip burst=2 nodelay;
      limit_req zone=lfm3_global burst=4 nodelay;
      limit_conn lfm3_active 1;
      proxy_pass https://x1-370.tailcb8954.ts.net:8450;
      proxy_ssl_server_name on;
      proxy_ssl_name x1-370.tailcb8954.ts.net;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /etc/nginx/verified-host-ca.pem;
      proxy_ssl_verify_depth 6;
      proxy_set_header Host x1-370.tailcb8954.ts.net:8450;
      proxy_set_header X-Forwarded-For $http_x_kipnerter_client_ip;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_send_timeout 10s;
      proxy_read_timeout 45s;
      proxy_buffering off;
      proxy_request_buffering on;
      add_header Cache-Control "no-store" always;
    }
    location / {
      limit_except GET HEAD { deny all; }
      proxy_pass https://x1-370.tailcb8954.ts.net:8450;
      proxy_ssl_server_name on;
      proxy_ssl_name x1-370.tailcb8954.ts.net;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /etc/nginx/verified-host-ca.pem;
      proxy_ssl_verify_depth 6;
      proxy_set_header Host x1-370.tailcb8954.ts.net:8450;
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      add_header Cache-Control "private, no-store" always;
    }
  }
}
